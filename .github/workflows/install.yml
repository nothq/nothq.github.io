name: Install script

# Runs install.sh against the latest release of each app on every platform it
# supports, then checks the app is there and starts.
on:
  pull_request:
    paths: [install.sh, .github/workflows/install.yml]
  push:
    branches: [main]
    paths: [install.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.app }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: [notslack, notnotion]
        os: [macos-15, macos-15-intel, ubuntu-22.04]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the app the way visitors do
        run: |
          if [ "$APP" = notslack ]; then
            cat install.sh | NOTHQ_NO_OPEN=1 sh
          else
            cat install.sh | NOTHQ_NO_OPEN=1 sh -s "$APP"
          fi

      - name: Check the macOS app
        if: runner.os == 'macOS'
        run: |
          app=/Applications/$APP.app
          codesign --verify --strict --verbose=2 "$app"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
            echo "$APP.app is quarantined, so Gatekeeper would block it" >&2
            exit 1
          fi
          open "$app"
          for _ in $(seq 30); do pgrep -x "$APP" && exit 0; sleep 1; done
          echo "$APP did not start" >&2
          exit 1

      - name: Check the Linux app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers
          test -x ~/.local/bin/$APP
          test -f ~/.local/share/applications/$APP.desktop
          xvfb-run -a timeout 15 ~/.local/bin/$APP || status=$?
          # timeout's 124 means the app was still running when it was stopped.
          [ "${status:-0}" = 124 ]
